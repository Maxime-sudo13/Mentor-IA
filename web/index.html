<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor IA</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231d2433%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 text-anchor=%22middle%22 fill=%22%23f5f2ea%22 font-family=%22Georgia%22%3EM%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="barre">
  <a class="logo" href="#/" aria-label="Accueil">
    <span class="logo-marque">M</span><span>Mentor<span class="logo-ia">IA</span></span>
  </a>
  <div class="barre-stats">
    <div class="stat" title="Jours de suite"><span class="stat-ico">🔥</span><b id="serie">0</b><span class="stat-label">jours</span></div>
    <div class="stat stat-temps" title="Temps de travail aujourd'hui">
      <div class="jauge"><div class="jauge-plein" id="jauge"></div></div>
      <span id="temps">0 / 45 min</span>
    </div>
    <div class="ia-etat" id="ia-etat" title="État de l'IA locale"><span class="point"></span><span id="ia-texte">IA</span></div>
    <button class="btn-icone" id="btn-profil" title="Mon profil" aria-label="Mon profil">⚙</button>
  </div>
</header>

<main id="vue"></main>

<div class="toast" id="toast" role="status" hidden></div>

<dialog id="dlg-profil">
  <form method="dialog" id="form-profil">
    <h2>Mon profil</h2>
    <label>Prénom<input name="prenom" maxlength="40" autocomplete="given-name"></label>
    <label>Objectif quotidien (minutes)<input name="objectif_minutes" type="number" min="10" max="240" step="5"></label>
    <p class="aide">Ta progression reste sur cet ordinateur (dossier <code>data/</code>). Rien n'est envoyé sur Internet.</p>
    <div class="actions">
      <button value="annuler" class="btn btn-sec">Annuler</button>
      <button value="ok" class="btn">Enregistrer</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
